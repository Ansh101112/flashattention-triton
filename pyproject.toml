[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flash-attn-triton"
version = "0.1.0"
description = "Exact IO-aware FlashAttention-2 forward and backward kernels in Triton"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Anshuman Tiwari" }]
keywords = ["attention", "triton", "cuda", "gpu", "flashattention", "kernel"]
dependencies = ["torch>=2.1", "triton>=2.2"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
